<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1 – Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- Cabeçalho -->
    <div class="max-w-sm rounded shadow p-4 bg-white border text-center">

        <!-- Título -->
        <h1 class="text-4xl font-black text-gray-800">
            Desenvolvimento
            <span class="text-amber-500">Web</span>
        </h1>

        <!-- Subtítulo -->
        <h2 class="text-2xl font-bold text-gray-600 mt-2">
            Aprendendo Tailwind
        </h2>

        <!-- Texto corrido -->
        <p class="text-base font-light text-gray-500 mt-4">
            Praticando e aprendendo a criar cabeçalho usando
            <span class="text-amber-500 font-bold">Tailwind</span>,
             diferentes tamanhos, pesos e cores de texto.
        </p>

</html>
