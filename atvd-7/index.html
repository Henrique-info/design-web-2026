<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1 – Tailwind</title>
    <!-- Tailwind CSS v4 (browser) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@latest/src/css/phosphor.css" />
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="flex items-center justify-between flex-wrap max-w-7xl mx-auto px-4">
        <div class="flex items-center justify-between flex-wrap">
            <!-- LOGO + SLOGAN -->
            <div>
                <h1 class="text-3xl font-bold text-green-600 no-underline">
                    <a href="/"
                        title="Instituto Federal de Educação, Ciência e Tecnologia do Estado do Rio Grande do Norte">
                        INSTITUTO FEDERAL
                    </a>
                </h1>
                <p class="hidden md:block">
                    Educação, Ciência, Cultura e Tecnologia em todo o Rio Grande do Norte
                </p>
            </div>

            <!-- MENU HAMBÚRGUER (mobile) -->
            <button id="menuToggle" aria-label="Menu" class="md:hidden border-none bg-transparent p-2 cursor-pointer">
                <i class="ph ph-list"></i>
            </button>

            <!-- NAVEGAÇÃO PRINCIPAL (desktop) -->
            <nav aria-label="Navegação principal">
                <ul class="hidden md:flex gap-4 items-center">
                    <li>
                        <a href="#" class="text-gray-700 hover:text-green-600 transition">Processos seletivos</a>
                    </li>
                    <li>
                        <a href="#" class="text-gray-700 hover:text-green-600 transition">Cursos</a>
                    </li>
                    <li>
                        <a href="#" class="text-gray-700 hover:text-green-600 transition">Campi</a>
                    </li>
                    <li>
                        <a href="#" class="text-gray-700 hover:text-green-600 transition">Institucional</a>
                    </li>
                    <li>
                        <a href="#" class="text-gray-700 hover:text-green-600 transition">Acesso à Informação</a>
                    </li>
                    <li>
                        <a href="#" class="text-gray-700 hover:text-green-600 transition">Eventos</a>
                    </li>
                    <li>
                        <a href="#" class="text-gray-700 hover:text-green-600 transition">Serviços</a>
                    </li>
                </ul>
            </nav>

            <!-- AÇÕES (ícones, busca, contraste, modo escuro) -->
            <div flex items-center gap-3>
                <!-- Ícones sociais -->
                <div>
                    <ul class="flex items-center gap-2 hidden md:flex">
                        <a href="#" aria-label="Instagram"><i class="ph ph-instagram-logo"></i></a>
                        <a href="#" aria-label="Twitter"><i class="ph ph-twitter-logo"></i></a>
                        <a href="#" aria-label="LinkedIn"><i class="ph ph-linkedin-logo"></i></a>
                        <a href="#" aria-label="YouTube"><i class="ph ph-youtube-logo"></i></a>
                        <a href="#" aria-label="Spotify"><i class="ph ph-spotify-logo"></i></a>
                        <a href="#" aria-label="TikTok"><i class="ph ph-tiktok-logo"></i></a>
                    </ul>
                </div>

                <!-- Busca -->
                <form method="get" action="/search/" class="flex items-center gap-2">
                    <input class="border rounded-full px-3 py-1 bg-gray-100 focus:outline-none focus:ring" type="search"
                        name="query" placeholder="Busca" aria-label="Busca" />
                    <button type="submit" aria-label="Pesquisar">
                        <i class="ph ph-magnifying-glass"></i>
                    </button>
                </form>

                <!-- Alto contraste -->
                <button id="altocontraste" type="button" aria-label="Alto contraste">
                    <i class="ph ph-contrast"></i>
                </button>

                <!-- Modo escuro -->
                <button type="button" aria-label="Modo escuro">
                    <i class="ph ph-moon"></i>
                </button>
            </div>
        </div>
    </header>

</body>

</html>
